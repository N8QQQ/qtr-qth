# Universal Orchestration: qtr-qth
# Supports Windows, Linux, Mac, and RPi via Docker Compose.

services:
  # 1. The Documentation Hub: Staging & Flare Iteration
  docs:
    build:
      context: .
      dockerfile: docker/docs/Dockerfile
    container_name: ${DOCS_CONTAINER_NAME:-qtr-qth-docs}
    ports:
      - "${STAGING_PORT:-4000}:4000"
    volumes:
      - ./docs:/srv/jekyll/content
    environment:
      - PAGES_REPO_NWO=N8QQQ/qtr-qth

  # 3. The Phantom Shack: Resource-Constrained Virtual Pi
  phantom:
    build:
      context: .
      dockerfile: docker/phantom/Dockerfile
    container_name: ${PHANTOM_CONTAINER_NAME:-qtr-qth-phantom}
    privileged: true # Required for TTY creation and USB access
    ports:
      - "9999:9999" # GPS Coordinator Bridge
    environment:
      - SIM_MODE=${SIM_MODE:-true}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    volumes:
      - .:/workspace
    working_dir: /workspace
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0" # Mapping physical GPS (Adjust as needed)
    cap_add:
      - SYS_TIME

  # 4. The Stress Tester: ARM64 Emulation (Local Pi Parity)
  stress-test:
    build:
      context: .
      dockerfile: docker/ci/Dockerfile
    platform: linux/arm64
    container_name: qtr-qth-stress-test
    volumes:
      - .:/workspace
    working_dir: /workspace
    deploy:
      resources:
        limits:
          cpus: '0.5' # Mimic an older Pi or heavy load
          memory: 512M
