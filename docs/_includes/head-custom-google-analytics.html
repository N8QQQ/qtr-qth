<!-- Mermaid.js for Technical Diagrams -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Standardize Mermaid fenced blocks from Kramdown
    const codeBlocks = document.querySelectorAll('pre > code.language-mermaid');
    codeBlocks.forEach(code => {
      const pre = code.parentElement;
      const mermaidDiv = document.createElement('div');
      mermaidDiv.className = 'mermaid';
      mermaidDiv.textContent = code.textContent;
      pre.replaceWith(mermaidDiv);
    });

    mermaid.initialize({
      startOnLoad: true,
      theme: 'default',
      securityLevel: 'loose',
      flowchart: { useMaxWidth: true, htmlLabels: true }
    });
  });
</script>

<!-- p5.js for Documentation Flare -->
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.js"></script>
<script src="{{ '/assets/js/flare.js' | relative_url }}" defer></script>
<style>
  .mermaid {
    background-color: white !important;
    padding: 1rem;
    border-radius: 4px;
    border: 1px solid #eee;
    margin: 1.5rem 0;
  }
  #p5-flare {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
    opacity: 0.4;
  }
</style>
