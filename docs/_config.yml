title: qtr-qth Documentation Hub
description: High-precision GPS Time (QTR) and Location (QTH) hub for technical radio shacks.
repository: N8QQQ/qtr-qth
remote_theme: pages-themes/minimal

# URL settings
url: "https://n8qqq.github.io"
baseurl: "/qtr-qth"
permalink: pretty

# Plugins
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-gist
  - jekyll-feed
  - jekyll-remote-theme

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Relative Links settings
relative_links:
  enabled: true
  collections: true

# Exclude files from processing
exclude:
  - vendor/
  - .bundle/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata/
  - Gemfile
  - Gemfile.lock
