# Universal Orchestration: qtr-qth
# Supports Windows, Linux, Mac, and RPi via Docker Compose.

services:
  # 1. The Documentation Hub: Staging & Flare Iteration
  docs:
    build:
      context: ..
      dockerfile: docker/docs/Dockerfile
    container_name: ${DOCS_CONTAINER_NAME:-qtr-qth-docs}
    ports:
      - "${STAGING_PORT:-4000}:4000"
    volumes:
      - ../docs:/srv/jekyll/content
    environment:
      - PAGES_REPO_NWO=N8QQQ/qtr-qth

  # 3. The Phantom Shack: Resource-Constrained Virtual Pi
  phantom:
    build:
      context: ..
      dockerfile: docker/phantom/Dockerfile
    container_name: ${PHANTOM_CONTAINER_NAME:-qtr-qth-phantom}
    privileged: true # Required for TTY creation and USB access
    ports:
      - "9999:9999" # GPS Coordinator Bridge
    environment:
      - SIM_MODE=${SIM_MODE:-true}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    volumes:
      - ../:/workspace
    working_dir: /workspace
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0" # Mapping physical GPS (Adjust as needed)
    cap_add:
      - SYS_TIME

  # 4. The Stress Tester: ARM64 Emulation (Local Pi Parity)
  stress-test:
    build:
      context: ..
      dockerfile: docker/phantom/Dockerfile
    platform: linux/arm64
    container_name: qtr-qth-stress-test
    volumes:
      - ../:/workspace
    working_dir: /workspace
    deploy:
      resources:
        limits:
          cpus: "0.5" # Mimic an older Pi or heavy load
          memory: 512M

  # --- Code Quality & Security Scan Profile ---
  # 5. Core Semantic & Security Analysis (CodeQL)
  codeql:
    build: codeql
    user: root
    profiles:
      - quality
    volumes:
      - ../:/src
      - ./codeql-results:/results
      - ~/.gradle:/root/.gradle
    working_dir: /src
    command:
      - bash
      - -c
      - "codeql database create /results/qtr-qth-db --threads=0 --ram=16384 --language=java --source-root=/src --overwrite && codeql database analyze /results/qtr-qth-db java-code-scanning.qls --threads=0 --ram=16384 --format=sarif-latest --output=/results/scan.sarif"

  # 6. Style, Syntax & Formatting (Super-Linter)
  super-linter:
    image: ghcr.io/super-linter/super-linter:latest
    profiles:
      - quality
    environment:
      - RUN_LOCAL=true
      - VALIDATE_ALL_CODEBASE=true
      - DEFAULT_BRANCH=main
      - LINTER_RULES_PATH=config/checkstyle
      - YAML_CONFIG_FILE=.yamllint.yaml
      - FILTER_REGEX_EXCLUDE=.*(gradlew.*|gradle/.*)
      - VALIDATE_YAML=true
      - VALIDATE_BASH=true
      - VALIDATE_JAVA=true
      - VALIDATE_XML=true
      - JAVA_FILE_NAME=checkstyle.xml
    volumes:
      - ../:/tmp/lint

  # 7. Secret Scanning (Gitleaks)
  gitleaks:
    image: zricethezav/gitleaks:latest
    profiles:
      - quality
    volumes:
      - ../:/path
    command: detect --source=/path --verbose --redact

  # 8. Software Composition Analysis (Trivy)
  trivy:
    image: aquasec/trivy:latest
    profiles:
      - quality
    volumes:
      - ../:/rootfs
      - .trivy-cache:/root/.cache/
    command: fs /rootfs
